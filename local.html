<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 지역 말벌 활동</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#EDF0EB;--surface:#fff;--ink:#1B2420;--muted:#5C6962;--line:#D3DAD4;--pine:#22463A;--amber:#E3A21A;--red:#C62828;
  --s0:#5E8C6A;--s1:#E6B422;--s2:#F07F23;--s3:#C62828;
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#111613;--surface:#19201C;--ink:#E4EAE6;--muted:#98A69E;--line:#2B3630;--pine:#7FC2A5}}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:50;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:1.1rem;flex:1;display:flex;gap:10px;align-items:center}
.stripe{width:26px;height:13px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--amber) 0 5px,#1B2420 5px 10px)}
main{max-width:680px;margin:0 auto;padding:0 14px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.93rem;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px}
.where{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.where .name{font-size:1.35rem;font-weight:700;flex:1;min-width:180px}
select{font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;flex:1}
.stage{border-radius:14px;padding:18px;color:#fff;margin:12px 0}
.stage .lab{font-size:.9rem;opacity:.92}
.stage .big{font-size:2rem;font-weight:700;line-height:1.2;margin:2px 0}
.stage .say{font-size:.98rem}
.stage.s0{background:var(--s0)} .stage.s1{background:var(--s1);color:#1B2420} .stage.s2{background:var(--s2)} .stage.s3{background:var(--s3)}
.cmp{font-size:.92rem;margin-top:8px;opacity:.95}
h2{font-size:1rem;margin:0 0 8px}
.note{font-size:.84rem;color:var(--muted);margin-top:8px}
svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:4px}
#map{height:300px;border-radius:10px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.tips{margin:0;padding-left:18px;font-size:.92rem} .tips li{margin:3px 0}
.empty{padding:26px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><h1><span class="stripe"></span>우리 지역 말벌 활동</h1><span class="note" id="dateLine" style="margin:0"></span></header>
<main>
  <div class="block">
    <div class="where"><div class="name" id="rName">지역을 찾는 중…</div><button class="btn" id="locBtn">내 위치로</button></div>
    <div class="row" style="margin-top:10px"><select id="sidoSel" aria-label="시도"></select><select id="sggSel" aria-label="시군구"></select></div>
  </div>

  <div id="body" style="display:none">
    <div class="stage" id="stage"><div class="lab">이번 주 말벌 활동</div><div class="big" id="stageBig"></div><div class="say" id="stageSay"></div><div class="cmp" id="cmp"></div></div>

    <div class="block">
      <h2>말벌 활동 흐름</h2>
      <div id="chart"></div>
      <div class="legend" id="legend"></div>
      <p class="note" id="chartNote"></p>
    </div>

    <div class="block">
      <h2>이렇게 대비하세요</h2>
      <ul class="tips" id="tips"></ul>
      <div class="row" style="margin-top:10px"><a class="btn red" href="tel:119">📞 119</a><a class="btn" id="reportLink">말벌·벌집 신고</a><a class="btn" id="mapLink">말벌 발생 지도</a></div>
    </div>

    <div class="block">
      <h2>우리 지역 지도</h2>
      <div id="map"></div>
      <dl class="kv" style="margin-top:10px" id="kv"></dl>
      <p class="note">색은 1km 단위 말벌 활동 경보(노랑 주의 · 주황 경계 · 빨강 심각)입니다. 기상청 관측을 바탕으로 매일 아침 갱신됩니다.</p>
    </div>
    <div class="row" style="margin:6px 2px 20px"><a class="btn" href="index.html">전국 보기 (담당자용)</a></div>
  </div>
  <div class="block empty" id="emptyBox" style="display:none"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const VWORLD_KEY = '';                                             // 브이월드 인증키 (비우면 OpenStreetMap)
const REPORT_URL = 'https://karl7208.github.io/hornet-report-/';     // 말벌 신고 앱
const SIDO = { '서울특별시':'서울','부산광역시':'부산','대구광역시':'대구','인천광역시':'인천','광주광역시':'광주','대전광역시':'대전','울산광역시':'울산',
  '세종특별자치시':'세종','경기도':'경기','강원도':'강원','강원특별자치도':'강원','충청북도':'충북','충청남도':'충남','전라북도':'전북','전북특별자치도':'전북',
  '전라남도':'전남','경상북도':'경북','경상남도':'경남','제주특별자치도':'제주' };
const STAGES = { '관심': 0, '주의': 1, '경계': 2, '심각': 3 };
const SAY = {
  '관심': '말벌 활동이 적은 때입니다.',
  '주의': '말벌이 활동하는 때입니다. 야외에서는 주변을 살피세요.',
  '경계': '말벌 활동이 활발합니다. 벌초·산행 전 벌집을 꼭 살피세요.',
  '심각': '말벌 활동이 가장 활발한 한 주입니다. 벌집 근처에 가지 마세요.' };
const TIPS = {
  '관심': ['벌집을 발견하면 직접 없애지 말고 119에 알리세요.'],
  '주의': ['밝은 색 긴 옷을 입고, 향수·향이 강한 화장품은 피하세요.', '벌이 계속 드나드는 땅속·나뭇가지는 벌집일 수 있습니다.'],
  '경계': ['벌초·성묘 전에 막대로 풀숲을 두드려 벌이 나오는지 먼저 보세요.', '밝은 색 긴 옷, 모자를 쓰고 향수는 피하세요.', '벌집을 건드렸다면 머리를 감싸고 20m 이상 빠르게 벗어나세요.'],
  '심각': ['벌집이 있을 만한 풀숲·무덤 주변 작업은 미루거나 전문가에게 맡기세요.', '벌집을 건드렸다면 머리를 감싸고 20m 이상 빠르게 벗어나세요.', '쏘인 뒤 어지럽거나 두드러기, 숨이 차면 바로 119.'] };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const bust = '?v=' + Date.now();
let LIST = [], META = null, map, marker;

const norm = s => { s = (s || '').trim(); for (const [k, v] of Object.entries(SIDO)) if (s.startsWith(k)) return v + s.slice(k.length); return s; };
function findRegion(r, lat, lon){
  if (r) {
    const n = norm(r).replace(/\s+/g, ' ');
    let hit = LIST.find(x => x.name === n);
    if (!hit) { const t = n.split(' '); hit = LIST.find(x => x.name.startsWith(t.slice(0, 2).join(' '))) || LIST.find(x => x.name.startsWith(t[0] + ' ') && t[1] && x.name.includes(t[1].replace(/(시|군|구)$/, ''))); }
    if (hit) return hit;
  }
  if (lat != null && lon != null) {
    const inBox = LIST.filter(x => lat >= x.bbox[0][0] && lat <= x.bbox[1][0] && lon >= x.bbox[0][1] && lon <= x.bbox[1][1]);
    const pool = inBox.length ? inBox : LIST;
    return pool.reduce((b, x) => { const d = (x.center[0] - lat) ** 2 + ((x.center[1] - lon) * 0.82) ** 2; return !b || d < b.d ? { x, d } : b; }, null)?.x;
  }
  return null;
}

function fillSelects(cur){
  const sidos = [...new Set(LIST.map(x => x.name.split(' ')[0]))];
  $('#sidoSel').innerHTML = sidos.map(s => `<option ${cur && cur.name.startsWith(s + ' ') ? 'selected' : ''}>${esc(s)}</option>`).join('');
  const fillSgg = () => {
    const s = $('#sidoSel').value;
    $('#sggSel').innerHTML = LIST.filter(x => x.name.startsWith(s + ' ')).map(x => `<option value="${x.code}" ${cur && cur.code === x.code ? 'selected' : ''}>${esc(x.name.slice(s.length + 1))}</option>`).join('');
  };
  fillSgg();
  $('#sidoSel').onchange = () => { fillSgg(); show(+$('#sggSel').value); };
  $('#sggSel').onchange = () => show(+$('#sggSel').value);
}

function chart(d){
  const W = 640, H = 250, L = 34, R = 10, T = 14, B = 30;
  const obs = d.series.map(s => ({ t: new Date(s.d), v: s.cw7 }));
  const out = (d.outlook || []).map(s => ({ t: new Date(s.d), v: s.v }));
  const cl = (d.clim || []).map(s => ({ t: new Date(s.d), m: s.m, lo: s.lo, hi: s.hi }));
  const all = [...obs, ...out, ...cl];
  const t0 = Math.min(...all.map(p => +p.t)), t1 = Math.max(...all.map(p => +p.t));
  const ymax = Math.max(70, ...all.map(p => Math.max(p.v ?? 0, p.hi ?? 0))) * 1.05;
  const X = t => L + (W - L - R) * (+t - t0) / Math.max(1, t1 - t0), Y = v => T + (H - T - B) * (1 - v / ymax);
  const path = pts => pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="말벌 활동 흐름 그래프">`;
  const th = d.thresholds, names = ['주의', '경계', '심각'], cols = ['var(--s1)', 'var(--s2)', 'var(--s3)'];
  th.forEach((v, i) => { if (v < ymax) s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${cols[i]}" stroke-width="1" stroke-dasharray="2 4" opacity=".9"/><text x="${W - R}" y="${Y(v) - 3}" font-size="10" text-anchor="end" fill="${cols[i]}">${names[i]}</text>`; });
  if (cl.length) {
    s += `<path d="${cl.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.hi).toFixed(1)}`).join('')}${cl.slice().reverse().map(p => `L${X(p.t).toFixed(1)},${Y(p.lo).toFixed(1)}`).join('')}Z" fill="var(--muted)" opacity=".13"/>`;
    s += `<path d="${path(cl.map(p => ({ t: p.t, v: p.m })))}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="1 3"/>`;
  }
  if (out.length) s += `<path d="${path([obs[obs.length - 1], ...out])}" fill="none" stroke="var(--pine)" stroke-width="2.4" stroke-dasharray="6 5"/>`;
  s += `<path d="${path(obs)}" fill="none" stroke="var(--pine)" stroke-width="2.8"/>`;
  const last = obs[obs.length - 1];
  s += `<line x1="${X(last.t)}" x2="${X(last.t)}" y1="${T}" y2="${H - B}" stroke="var(--ink)" stroke-width="1" opacity=".35"/><text x="${X(last.t) + 3}" y="${T + 10}" font-size="10" fill="var(--ink)">오늘</text>`;
  s += `<circle cx="${X(last.t)}" cy="${Y(last.v)}" r="4.5" fill="var(--pine)"/>`;
  [0, 25, 50, 75, 100].filter(v => v <= ymax).forEach(v => s += `<text x="${L - 5}" y="${Y(v) + 3}" font-size="10" text-anchor="end" fill="var(--muted)">${v}</text>`);
  for (let t = t0; t <= t1; t += 7 * 864e5) { const dd = new Date(t); s += `<text x="${X(t)}" y="${H - 10}" font-size="10" text-anchor="middle" fill="var(--muted)">${dd.getMonth() + 1}/${dd.getDate()}</text>`; }
  s += '</svg>';
  $('#chart').innerHTML = s;
  $('#legend').innerHTML = `<span><i style="background:var(--pine)"></i>관측 (7일 평균)</span>` + (out.length ? `<span><i style="background:repeating-linear-gradient(90deg,var(--pine) 0 6px,transparent 6px 11px)"></i>앞으로 2주 전망</span>` : '') + (cl.length ? `<span><i style="background:var(--muted);opacity:.35;height:9px"></i>평년 범위</span>` : '');
  $('#chartNote').textContent = out.length
    ? '전망은 최근 추세가 서서히 평년으로 돌아간다고 보고 계산한 참고값입니다. 실제 날씨에 따라 달라질 수 있습니다.'
    : '평년 자료가 준비되면 앞으로 2주 전망과 평년 범위가 함께 표시됩니다.';
}

function drawMap(d){
  if (!map) {
    map = L.map('map', { zoomControl: true });
    (VWORLD_KEY ? L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/Base/{z}/{y}/{x}.png`, { maxZoom: 18, attribution: '© 국토교통부 브이월드' })
                : L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' })).addTo(map);
    if (META) L.imageOverlay('data/latest/alert.png' + bust, META.bounds, { opacity: .7 }).addTo(map);
  }
  map.fitBounds(d.bbox);
  if (marker) map.removeLayer(marker);
  marker = L.circleMarker(d.center, { radius: 6, color: '#fff', weight: 2, fillColor: '#1B2420', fillOpacity: 1 }).addTo(map).bindTooltip(d.name);
  setTimeout(() => map.invalidateSize(), 60);
}

async function show(code){
  const d = await (await fetch(`data/latest/local/${code}.json` + bust)).json();
  try { localStorage.setItem('hi.region', String(code)); } catch {}
  $('#rName').textContent = d.name; $('#body').style.display = ''; $('#emptyBox').style.display = 'none';
  $('#dateLine').textContent = `${d.date} 관측 기준`;
  const st = d.stage, el = $('#stage');
  el.className = 'stage s' + STAGES[st];
  $('#stageBig').textContent = st; $('#stageSay').textContent = SAY[st];
  $('#cmp').textContent = d.anomaly != null ? (Math.abs(d.anomaly) < 3 ? '평년과 비슷한 수준입니다.' : d.anomaly > 0 ? `평년보다 높습니다 (+${d.anomaly}).` : `평년보다 낮습니다 (${d.anomaly}).`) : '';
  $('#tips').innerHTML = TIPS[st].map(t => `<li>${esc(t)}</li>`).join('');
  $('#kv').innerHTML = [['말벌 활동 지수 (7일 평균)', d.cw7], ['주의 이상 면적', d.pct['주의'] + '%'], ['경계 이상 면적', d.pct['경계'] + '%'], ['심각 면적', d.pct['심각'] + '%'], ['상습 지역 (이 계절)', d.chronic_pct + '%']]
    .map(([a, b]) => `<dt>${a}</dt><dd>${esc(b)}</dd>`).join('');
  chart(d); drawMap(d); fillSelects(d);
  const q = new URLSearchParams(location.search); q.set('r', d.name); history.replaceState(null, '', '?' + q.toString());
}

$('#locBtn').onclick = () => {
  if (!navigator.geolocation) return alert('이 기기는 위치를 알려주지 않습니다. 목록에서 골라 주세요.');
  $('#rName').textContent = '내 위치를 찾는 중…';
  navigator.geolocation.getCurrentPosition(p => { const x = findRegion(null, p.coords.latitude, p.coords.longitude); if (x) show(x.code); },
    () => { $('#rName').textContent = '위치를 찾지 못했습니다. 아래 목록에서 골라 주세요.'; }, { enableHighAccuracy: false, timeout: 12000 });
};
$('#reportLink').href = REPORT_URL; $('#mapLink').href = REPORT_URL + 'map.html';

(async () => {
  try {
    const j = await (await fetch('data/latest/local/regions.json' + bust)).json();
    LIST = j.regions;
    META = await (await fetch('data/latest/meta.json' + bust)).json().catch(() => null);
  } catch {
    $('#rName').textContent = '자료를 불러오지 못했습니다.'; $('#emptyBox').style.display = ''; $('#emptyBox').textContent = '매일 아침 계산이 끝나면 다시 열어 주세요.'; return;
  }
  const q = new URLSearchParams(location.search);
  let saved = null; try { saved = +localStorage.getItem('hi.region'); } catch {}
  const hit = findRegion(q.get('r'), q.get('lat') ? +q.get('lat') : null, q.get('lon') ? +q.get('lon') : null)
           || (saved && LIST.find(x => x.code === saved));
  if (hit) return show(hit.code);
  fillSelects(null);
  $('#rName').textContent = '우리 지역을 골라 주세요';
  $('#emptyBox').style.display = ''; $('#emptyBox').innerHTML = '위의 <b>내 위치로</b>를 누르거나 목록에서 시도와 시군구를 고르면<br>이번 주 말벌 활동과 앞으로의 흐름을 보여 드립니다.';
})();
</script>
</body>
</html>
